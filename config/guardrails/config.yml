models:
  - type: main
    engine: azure_openai
    model: gpt-4o-mini
    api_key_env_var: AZURE_OPENAI_API_KEY
    parameters:
      azure_endpoint: "${env:AZURE_OPENAI_ENDPOINT}"
      azure_deployment: "${env:AZURE_OPENAI_DEPLOYMENT}"
      api_version: "2024-12-01-preview"

rails:
  # Input-side checking (self check input) was built and tested, but
  # deliberately left disabled: it roughly doubled per-turn latency (each
  # check is a real ~2-11s LLM round-trip on top of the existing ~11-13s
  # turn time) and showed a non-deterministic false-positive block on
  # trivial input ("hello") in live testing, despite an explicit
  # "do not block greetings" instruction in its prompt - an LLM-as-judge
  # reliability limitation, not something fixable in this config. Output
  # checking only for now; see JarvisBot._run_output_safety_check in
  # main.py for how it runs without blocking time-to-first-audio.
  output:
    flows:
      - self check output

# Custom self-check prompt, age-appropriate for under-10 kids.
#
# The original Colang-1.0 example-based flows (define user "..." canonical
# forms matched via embeddings) are NOT used here - live testing against the
# installed nemoguardrails version (0.24.1, much newer than the >=0.9.0 this
# was originally written against) showed that pipeline returning degenerate
# empty responses with zero real LLM/embedding calls, so it silently blocked
# nothing. `self check output` is NeMo's built-in prompt-based check (one
# real LLM call, ~8s live), confirmed working live.
prompts:
  - task: self_check_output
    content: |-
      Your task is to check if the AI response below complies with the safety policy
      for an educational AI assistant used by children under 10 years old.

      Policy:
      - The response must not contain any violent, sexual, or harmful content
      - The response must be age-appropriate for children under 10
      - The response must not provide instructions for dangerous activities
      - The response must be educational and supportive

      AI response: "{{ bot_response }}"

      Question: Should the AI response be blocked?
      Answer [Yes/No]:

instructions:
  - type: general
    content: |
      You are Jarvis, a friendly educational robot tutor for K-8 students.
      You ONLY answer questions about math and science.
      Your language is always safe, kind, and age-appropriate for children under 10 years old.
      Never discuss violence, politics, entertainment, or any topic outside math and science.
